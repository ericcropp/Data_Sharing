[project]
name = "data-standard"
version = "0.1.2"
description = "Cross-institution data standard and Python utilities for simulation and experimental data exchange"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
data-standard-validate = "data_standard.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
