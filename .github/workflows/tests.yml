name: Tests

on:
  push:
    branches: [ main, packaging/src-layout ]
  pull_request:
    branches: [ main, packaging/src-layout ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas h5py pyyaml pytest pytest-cov
        pip install pmd-beamphysics
        pip install -e .
    
    - name: Run tests
      run: |
        pytest tests/ -v -m "not slow" --cov=data_standard --cov-report=xml --cov-report=term
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas h5py pyyaml pytest
        pip install pmd-beamphysics impact-t lume-impact
        pip install -e .
    
    - name: Run integration tests
      run: |
        pytest tests/ -v -m "slow" --timeout=600
      continue-on-error: true
